<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Fleet Sheet Generator</title>
    
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Monaco', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #ff9d42;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px dashed #333;
            padding-bottom: 10px;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }
        input {
            background: #1f2128;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: monospace;
            width: 80px;
        }
        button {
            background: #ff9d42;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.1s;
        }
        button:hover {
            background: #ffb85c;
        }
        #fleet-container {
            display: grid;
            margin-top: 10px;
            justify-content: flex-start;
        }
        .ship-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #222;
            border-radius: 4px;
            width: 120px;
            height: 120px;
            position: relative;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .trait-badge {
            position: absolute;
            bottom: 3px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.75);
            padding: 1px 0;
        }
    </style>
    
</head>
<body>

    <h2>🛰️ Procedural Fleet Sheet Generator</h2>

    <!-- MINIMALIST UNIFIED TOOLBAR: NUMBERS ON LEFT, ACTION BUTTONS IN MIDDLE, TOGGLES ON RIGHT -->
    <div class="control-panel" style="display: flex; gap: 20px; align-items: center; justify-content: space-between; padding: 12px 18px; min-width: 950px; box-sizing: border-box; background: rgba(255, 255, 255, 0.03); border: 1px solid #333; border-radius: 6px; margin-bottom: 20px;">
        
        <!-- LEFT SECTOR: HORIZONTAL COMPACT NUMBER ENTRIES -->
        <div class="inputs-row" style="display: flex; gap: 12px; align-items: center;">
            <div class="control-group" style="display: flex; flex-direction: column; gap: 3px;">
                <label for="input-count" style="font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Ships</label>
                <input type="number" id="input-count" value="64" min="1" max="256" style="background: #1f2128; border: 1px solid #444; color: #fff; padding: 5px 8px; border-radius: 4px; font-family: monospace; width: 55px; font-size: 11px;">
            </div>
            <div class="control-group" style="display: flex; flex-direction: column; gap: 3px;">
                <label for="input-columns" style="font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Cols</label>
                <input type="number" id="input-columns" value="8" min="1" max="24" style="background: #1f2128; border: 1px solid #444; color: #fff; padding: 5px 8px; border-radius: 4px; font-family: monospace; width: 45px; font-size: 11px;">
            </div>
            <div class="control-group" style="display: flex; flex-direction: column; gap: 3px;">
                <label for="input-spacing" style="font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Space</label>
                <input type="number" id="input-spacing" value="6" min="0" max="50" style="background: #1f2128; border: 1px solid #444; color: #fff; padding: 5px 8px; border-radius: 4px; font-family: monospace; width: 45px; font-size: 11px;">
            </div>
            <div class="control-group" style="display: flex; flex-direction: column; gap: 3px;">
                <label for="input-rotation" style="font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Rot(°)</label>
                <input type="number" id="input-rotation" value="0" min="0" max="360" style="background: #1f2128; border: 1px solid #444; color: #fff; padding: 5px 8px; border-radius: 4px; font-family: monospace; width: 45px; font-size: 11px;">
            </div>
            <div class="control-group" style="display: flex; flex-direction: column; gap: 3px;">
                <label for="input-scale" style="font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Scale(%)</label>
                <input type="number" id="input-scale" value="100" min="0" max="300" style="background: #1f2128; border: 1px solid #444; color: #fff; padding: 5px 8px; border-radius: 4px; font-family: monospace; width: 55px; font-size: 11px;">
            </div>
        </div>

        <!-- MIDDLE SECTOR: TIGHTLY PACKED ACTION BUTTONS -->
        <div class="buttons-center-cluster" style="display: flex; gap: 8px; align-items: center; justify-content: center; flex-grow: 1; max-width: 340px; margin: 0 10px;">
            <button onclick="generateFleetSheet()" style="background: #ff9d42; color: #000; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 10px; flex: 1; white-space: nowrap;">Forge Fleet</button>
            <button onclick="exportFleetAsPNG()" style="background: #ff3d00; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 10px; flex: 1; white-space: nowrap;">Export PNG</button>
            <button onclick="exportFleetAsSVG()" style="display: none;">🧬 SVG</button>
        </div>

        <!-- RIGHT SECTOR: REWORKED 4-ROW COMPACT VARIATION MATRIX CONTAINER (INTUITIVE TOGGLES) -->
        <div class="toggles-right-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 15px; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 4px; border: 1px solid #222; font-size: 10px; width: max-content; box-sizing: border-box;">
            <!-- ROW 1: ARSENAL & GLOBAL THEMING CONTROLS -->
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff9d42; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="toggle-label" checked style="width: auto; margin: 0; transform: scale(0.85);"> Weapon Labels
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #77cc99; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="toggle-single-color" style="width: auto; margin: 0; transform: scale(0.85);"> Single Color Scheme
            </label>
            <div style="display: none;"></div> <!-- Grid alignment buffer filler -->

            <!-- ROW 2: SPATIAL ORIENTATION MUTATIONS POOL -->
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-inverted" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Inverted Wings
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="force-inverted" style="width: auto; margin: 0; transform: scale(0.85);"> Always Inverted Wings
            </label>
            <div style="display: none;"></div>

            <!-- ROW 3: ALL INDIVIDUAL DETAILED CHASSIS WING VARIANTS -->
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-slickback" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Slickback (1)
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-quad-pods" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Quad Flaps (2)
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-stinger" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Stinger (3)
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-triple-pods" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Triple Pods (4)
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-snub" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Snub Wing (5)
            </label>
            <!-- NEW PROTOTYPE INPUT OPTIONS HOOKED UP SEAMLESSLY -->
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-rectangular" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Rect (6)
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ff5555; font-weight: bold; white-space: nowrap;">
                <input type="checkbox" id="allow-v-sharp" checked style="width: auto; margin: 0; transform: scale(0.85);"> Allow Sharp V (7)
            </label>

            <div style="display: none;"></div>

            <!-- ROW 4: FIXED INTUITIVE RENDER TOGGLES (Checked = Visible by default!) -->
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; white-space: nowrap;">
                <input type="checkbox" id="toggle-wings" checked style="width: auto; margin: 0; transform: scale(0.85);"> Show Wings Geometry
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; white-space: nowrap;">
                <input type="checkbox" id="toggle-pods" checked style="width: auto; margin: 0; transform: scale(0.85);"> Show Gun Pods
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; white-space: nowrap;">
                <input type="checkbox" id="toggle-hull" checked style="width: auto; margin: 0; transform: scale(0.85);"> Show Fuselage Core
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; white-space: nowrap;">
                <input type="checkbox" id="toggle-decals" checked style="width: auto; margin: 0; transform: scale(0.85);"> Show Decal Accents
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; white-space: nowrap;">
                <input type="checkbox" id="toggle-canopy" checked style="width: auto; margin: 0; transform: scale(0.85);"> Show Cockpit Visor
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; white-space: nowrap;">
                <input type="checkbox" id="toggle-thrusters" checked style="width: auto; margin: 0; transform: scale(0.85);"> Show Engine Jets
            </label>
        </div>


    </div>

    <!-- CENTERED FLEET CONTAINER AREA WRAPPER -->
    <div style="display: flex; width: 100%; justify-content: center; box-sizing: border-box; padding-top: 10px;">
        <div id="fleet-container" style="display: grid; justify-content: center;"></div>
    </div>


    <script>
             // Custome Ship Colors
            const PALLETS = [
                '#e1c6e5',
                '#e5e3e7',
                '#e4e8e3', 
                '#ffd700',
                '#ff9d42', 
                '#77cc99', 
                '#00b2e3',
                '#56c1bc',
                '#f8d0ac',
                '#6dcff6',
                '#f49ac1',
                '#fff799',
                '#bcbec0',
                '#ea399a',

                '#ff3d00'
            ];

            // Custom ship Accent colors
            const ACCENTS = [
                '#d4b0db', 
                '#ff9d42', 
                '#77cc99', 
                '#fff200', 
                '#ffffff',
                '#f06eaa',
                '#8197cd',
                '#8dc63f',
                
                '#00e5ff'
            ];
            
 function executeProceduralChassisPaths(ctx, cache) {
    if (!ctx || !cache) return;

    // =========================================================================
    // MASTER UI CHECKBOX VARIABLE BINDINGS (CRASH-PROOF SYNCHRONIZATION)
    // =========================================================================
    // These variables MUST point exactly to your HTML element IDs to prevent script crashes!
    const showWings = document.getElementById('toggle-wings') ? document.getElementById('toggle-wings').checked : true;
    const showPods = document.getElementById('toggle-pods') ? document.getElementById('toggle-pods').checked : true;
    const showHull = document.getElementById('toggle-hull') ? document.getElementById('toggle-hull').checked : true;
    const showDecals = document.getElementById('toggle-decals') ? document.getElementById('toggle-decals').checked : true;
    const showThrusters = document.getElementById('toggle-thrusters') ? document.getElementById('toggle-thrusters').checked : true;
    
    // FIXED: Maps your id="toggle-canopy" checkbox state cleanly to the showCanopy variable!
    const showCanopy = document.getElementById('toggle-canopy') ? document.getElementById('toggle-canopy').checked : true;
            // =========================================================================
        // WING PATH MATH SUBROUTINE (FIXED FOR FULL RESOLUTION SPHERICAL FUEL PODS)
        // =========================================================================
        function drawComponentSide(isLeft, type, invert, isSilhouette) {
            ctx.save();
            if (isLeft) ctx.scale(-1, 1); 
            if (invert) ctx.scale(1, -1);  

            if (isSilhouette) {
                ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
            } else {
                ctx.fillStyle = cache.hullColor; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
            }

            const wM = cache.wingWidthMult;
            const pM = cache.podLengthMult;

            if (type === 1) {
                // Type 1: Slickback Razor Wing Geometry
                ctx.beginPath(); ctx.moveTo(10, -20 * pM);
                if (invert) {
                    ctx.bezierCurveTo(34 * wM, 10 * pM, 54 * wM, 26 * pM, 54 * wM, 34 * pM);
                    ctx.bezierCurveTo(54 * wM, 40 * pM, 42 * wM, 40 * pM, 24 * wM, 38 * pM);
                } else {
                    ctx.lineTo(54 * wM, 40 * pM); ctx.lineTo(24 * wM, 38 * pM);
                }
                ctx.lineTo(10, 42 * pM); ctx.lineTo(0, 44 * pM); ctx.fill(); ctx.stroke();
            } 
                        else if (type === 2) {
                // =========================================================================
                // FIXED TYPE 2: QUAD FLAPS (FRONT POD ON TOP LAYER OVERRIDE)
                // =========================================================================
                // Draws the rear pod first, then the front pod last so it stacks perfectly on top!
                ctx.beginPath();
                ctx.arc(16 * wM, 22 * pM, 17 * pM, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(22 * wM, -4 * pM, 21 * pM, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            } 
            else if (type === 3) {
                ctx.beginPath(); ctx.moveTo(10, -20 * pM); ctx.lineTo(38 * wM, 4 * pM); ctx.lineTo(38 * wM, -32 * pM); ctx.lineTo(44 * wM, 26 * pM); ctx.lineTo(32 * wM, 22 * pM); ctx.lineTo(0, 44 * pM);
                ctx.fill(); ctx.stroke();
            } 
            else if (type === 4) {
                // =========================================================================
                // FIXED TYPE 4: TRIPLE STACKED PODS (MIDDLE POD ON TOP LAYER OVERRIDE)
                // =========================================================================
                // Draws the top and bottom pods first, then layers the middle cluster pod last!
                ctx.beginPath();
                ctx.arc(20 * wM, -14 * pM, 13 * pM, 0, Math.PI * 2); 
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(20 * wM, 24 * pM, 13 * pM, 0, Math.PI * 2); 
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(22 * wM, 6 * pM, 16 * pM, 0, Math.PI * 2);  
                ctx.fill(); ctx.stroke();
            } else if (type === 5) {
                // Type 5: Snub Wing Minimalist Variant Panel Base
                ctx.beginPath();
                ctx.moveTo(10, -18 * pM);
                ctx.lineTo(22 * wM, -18 * pM);
                ctx.lineTo(24 * wM, -14 * pM); 
                ctx.lineTo(24 * wM, 34 * pM);
                ctx.bezierCurveTo(24 * wM, 42 * pM, 14 * wM, 42 * pM, 12 * wM, 40 * pM);
                ctx.lineTo(0, 44 * pM);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
            }

                        // =========================================================================
            // NEW TYPE 6: RECTANGULAR CARGO HOUSING (WITH SOLID BLACK ACCENT DISC DETAIL)
            // =========================================================================
            else if (type === 6) {
                ctx.beginPath();
                
                // Establish geometric structural coordinate bounds
                const innerX = 6;        
                const outerX = 42 * wM;
                const topY = -10 * pM;    
                const bottomY = 32 * pM;
                const cornerRadius = 3.5; 
                const biteSize = 15 * wM; 
                
                // 1. Draw the primary wing panel base plate
                ctx.moveTo(innerX, topY);
                ctx.lineTo(outerX - biteSize, topY);
                ctx.arcTo(outerX - biteSize, topY + biteSize, outerX, topY + biteSize, biteSize);
                ctx.lineTo(outerX, topY + biteSize);
                ctx.arcTo(outerX, bottomY, innerX, bottomY, cornerRadius);
                ctx.arcTo(innerX, bottomY, innerX, topY, cornerRadius);
                ctx.lineTo(innerX, bottomY);
                ctx.lineTo(0, 44 * pM);
                ctx.closePath();
                ctx.fill(); 
                ctx.stroke();

                // 2. FIXED: INJECT SOLID CHARCOAL MECHANICAL DETAILED LAYER DISC
                // Only renders this core tech accent detail if the ship is drawn in full color
                if (!isSilhouette) {
                    ctx.save();
                    ctx.fillStyle = '#1e1b18'; // Matches your charcoal interior base panels
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    
                    // Center the circular mechanical node perfectly in the middle of the block panel space
                    const circleX = (innerX + outerX) / 2 + 2;
                    const circleY = (topY + bottomY) / 2 + 4;
                    const circleRadius = 10 * wM; // Scaled proportionally to match your screenshot reference
                    
                    ctx.beginPath();
                    ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
                    ctx.fill(); 
                    ctx.stroke();
                    ctx.restore();
                }
            }
            // =========================================================================
            // NEW TYPE 7: SHARP V-CHEVRON SHIELD (FLIPPED ORIENTATION + CHARCOAL INSERT)
            // =========================================================================
            else if (type === 7) {
                // FIXED FOR ORIENTATION: Reversed Y mathematical scales so it points back by default!
                const y1 = -16 * pM; // Forward attachment point
                const y2 = 24 * pM;  // Backward tip extension sweep point
                const y3 = 30 * pM;  // Backward outer tip bezel edge
                const y4 = 12 * pM;  // Inner slice point returning to fuselage
                const yTail = -36 * pM; // Trailing spine alignment point

                // 1. Draw the primary wing chevron base plate
                ctx.beginPath();
                ctx.moveTo(4, y1);                         
                ctx.lineTo(52 * wM, y2);                    
                ctx.lineTo(44 * wM, y3);                    
                ctx.lineTo(4, y4);                          
                ctx.lineTo(0, yTail);                          
                ctx.closePath();
                ctx.fill(); 
                ctx.stroke();

                // 2. FIXED: INJECT CO-CENTRIC INNER CHARCOAL MECHANICAL CHASSIS PATH
                if (!isSilhouette) {
                    ctx.save();
                    ctx.fillStyle = '#1e1b18';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;

                    // Trace a slightly smaller, nested internal path loop to mimic a layered frame insert
                    ctx.beginPath();
                    ctx.moveTo(12, y1 + 10);
                    ctx.lineTo(44 * wM, y2 + 2);
                    ctx.lineTo(40 * wM, y3 - 4);
                    ctx.lineTo(12, y4 - 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            ctx.restore();
        }

    // --- 1. RENDER WINGS AND EXTERIOR SILHOUETTES GATED ---

    if (showWings) {
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
        ctx.fillRect(-22 * cache.wingWidthMult, -18, 44 * cache.wingWidthMult, 60 * cache.podLengthMult);

        drawComponentSide(false, cache.wingStyle, cache.invertWings, true);
        drawComponentSide(true, cache.wingStyle, cache.invertWings, true);
    }

    let noseY = (cache.noseStyle === 2) ? -66 : -44;
    
    // --- 2. HULL BASE STRUCTURE UNDERLAY GATED ---
    if (showHull) {
        ctx.save();
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.moveTo(0, noseY); ctx.lineTo(5, noseY + 4); ctx.lineTo(5, 44); ctx.lineTo(-5, 44); ctx.lineTo(-5, noseY + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    ctx.shadowBlur = 0; 

    if (showWings) {
        ctx.fillStyle = '#1e1b18';
        ctx.fillRect(-20 * cache.wingWidthMult, -16, 40 * cache.wingWidthMult, 56 * cache.podLengthMult);

        drawComponentSide(false, cache.wingStyle, cache.invertWings, false);
        drawComponentSide(true, cache.wingStyle, cache.invertWings, false);
    }

    // --- 3. MAIN INNER FUSELAGE CORE GATED ---
    if (showHull) {
        ctx.fillStyle = '#1e1b18'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, noseY + 12); ctx.bezierCurveTo(5, noseY + 12, 7, -20, 7, -10); ctx.lineTo(7, 32); ctx.bezierCurveTo(3, 36, -3, 36, -7, 32); ctx.lineTo(-7, -10); ctx.bezierCurveTo(-7, -20, -5, noseY + 12, 0, noseY + 12);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    if (showWings) {
        function drawInteriorMechanics(isLeft, type, invert) {
            ctx.save(); if (isLeft) ctx.scale(-1, 1); if (invert) ctx.scale(1, -1);
            ctx.fillStyle = '#1e1b18'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            const wM = cache.wingWidthMult; const pM = cache.podLengthMult;
            if (type === 1) ctx.fillRect(12, -14 * pM, 8 * wM, 44 * pM);
            else if (type === 2 || type === 4 || type === 5) ctx.fillRect(5, 12 * pM, 8 * wM, 20 * pM);
            else if (type === 3) {
                ctx.beginPath(); ctx.moveTo(14, 6 * pM); ctx.lineTo(34 * wM, 6 * pM); ctx.lineTo(34 * wM, 20 * pM); ctx.lineTo(14, 26 * pM); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }
        drawInteriorMechanics(false, cache.wingStyle, cache.invertWings);
        drawInteriorMechanics(true, cache.wingStyle, cache.invertWings);
    }

    // --- 4. WING DECAL PATTERNS GATED ---
    if (showWings && showDecals) {
        function drawPodDecals(isLeft, type, invert, decalMode) {
            ctx.save(); if (isLeft) ctx.scale(-1, 1); if (invert) ctx.scale(1, -1);
            ctx.fillStyle = cache.trimColor; ctx.strokeStyle = cache.trimColor; ctx.lineWidth = 2;
            const wM = cache.wingWidthMult; const pM = cache.podLengthMult;

                if (showWings) {
                    svg += `      <rect x="${-20 * wM}" y="-16" width="${40 * wM}" height="${56 * pM}" fill="#1e1b18" />\n`;
                    svg += `      ${buildWingPath(false)}\n`;
                    svg += `      ${buildWingPath(true)}\n`;
                }

                // 4. Draw Inner Core Fuselage Panels
                if (showHull) {
                    svg += `      <path d="M 0 ${noseY + 12} C 5 ${noseY + 12} 7 -20 7 -10 L 7 32 C 3 36 -3 36 -7 32 L -7 -10 C -7 -20 -5 ${noseY + 12} 0 ${noseY + 12} Z" fill="#1e1b18" stroke="#ffffff" stroke-width="2" />\n`;
                }

                // 5. Draw Decorative Accent Decals
                if (showWings && showDecals) {
                    const scaleY = cache.invertWings ? -1 : 1;
                    if (cache.wingStyle === 2) {
                        svg += `      <circle cx="${22 * wM}" cy="${-4 * pM * scaleY}" r="${6}" fill="${cache.trimColor}" />\n`;
                        svg += `      <circle cx="${-22 * wM}" cy="${-4 * pM * scaleY}" r="${6}" fill="${cache.trimColor}" />\n`;
                    } else if (cache.wingStyle === 5) {
                        svg += `      <rect x="${13 * wM}" y="${-4 * pM * scaleY}" width="6" height="3" fill="${cache.trimColor}" />\n`;
                        svg += `      <rect x="${-13 * wM - 6}" y="${-4 * pM * scaleY}" width="6" height="3" fill="${cache.trimColor}" />\n`;
                    }
                }

                // 6. Draw Engine Jet Configurations
                if (showThrusters) {
                    if (cache.engineLayout === 1) {
                        svg += `      <path d="M ${-5 * eS} 32 L ${5 * eS} 32 L ${8 * eS} 42 L ${-8 * eS} 42 Z" fill="#1e1b18" stroke="#ffffff" stroke-width="1.5" />\n`;
                        svg += `      <rect x="${-4 * eS}" y="42" width="${8 * eS}" height="6" fill="#ff5500" />\n`;
                    } else {
                        svg += `      <rect x="${-12 * eS}" y="32" width="${6 * eS}" height="8" fill="#ff5500" stroke="#ffffff" stroke-width="1" />\n`;
                        svg += `      <rect x="${6 * eS}" y="32" width="${6 * eS}" height="8" fill="#ff5500" stroke="#ffffff" stroke-width="1" />\n`;
                    }
                }

                // 7. Draw Wing Gun Pod Barrels
                if (showPods && cache.hasGunPods) {
                    svg += `      <rect x="10" y="-20" width="2" height="24" fill="#ffffff" />\n`;
                    svg += `      <rect x="-12" y="-20" width="2" height="24" fill="#ffffff" />\n`;
                }

                // 8. Draw Central Cockpit Glass Frames
                if (showDecals) {
                    svg += `      <path d="M -4 -2 A 4 4 0 0 1 4 -2 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" />\n`;
                    svg += `      <line x1="-4" y1="4" x2="4" y2="4" stroke="#ffffff" stroke-width="2" />\n`;
                    svg += `      <rect x="-3" y="16" width="6" height="8" fill="none" stroke="${cache.trimColor}" stroke-width="2" />\n`;
                }

                svg += `    </g>\n`; // Closes nested local canvas transformation node cleanly

                // 9. Overlay Text Ribbon Struts
                if (displayLabels) {
                    svg += `    <rect y="106" width="120" height="14" fill="rgba(0,0,0,0.75)" />\n`;
                    svg += `    <text x="60" y="115" fill="${badgeColors[cache.weaponTrait]}" font-family="monospace" font-size="8px" font-weight="900" text-anchor="middle" letter-spacing="0.5px">${cache.weaponTrait}</text>\n`;
                }

                svg += `  </g>\n`; // Closes cell tracking matrix container tag
            });

            svg += `</svg>`;

            // Trigger the native vector save file download prompt box natively
            const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const downloadLink = document.createElement('a');
            downloadLink.download = 'procedural_fleet_sheet.svg';
            downloadLink.href = URL.createObjectURL(svgBlob);
            downloadLink.click();
        }

        window.onload = generateFleetSheet;

        // copyright smurphshire 2026
    </script>
</body>
</html>
