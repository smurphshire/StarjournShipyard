    <script>
             // Custome Ship Colors
            const PALLETS = [
              //  '#e1c6e5', // lavender pink
                '#e5e3e7', // very light gray
              //  '#e4e8e3', // near white gray
                '#ffd700', // Bright Yellow
                '#ff9d42',  //Bright Orange
                '#77cc99', // Bright Mint Green
                '#00b2e3', // Bright Blue
                '#56c1bc', // Tealish
              //  '#f8d0ac', // Pale Orange
              //  '#6dcff6', // Baby Blue
              //  '#f49ac1', //Pink
               // '#fff799', // light/pale yellow
                '#bcbec0', // Gray
                '#ea399a', // Magenta
                '#ff3d00', // red
               // '#ffffff' // White

            ];

            // Custom ship Accent colors
            const ACCENTS = [
                  '#e1c6e5', // lavender pink
                '#d4b0db', // lilac purple
                '#ff9d42', // Orange
                '#77cc99',  // Mint Green
                '#f8d0ac', // Pale Orange
               '#fff200', // Bright Yellow
              //  '#f06eaa', // Pink magenta
                '#8197cd', // cold steel blue
               '#8dc63f', // Green
               '#fff799', // light/pale yellow
                 '#6dcff6', // Baby Blue  
              //  '#00e5ff,' // Neon Blue
                '#ffffff' // White

            ];
            
 function executeProceduralChassisPaths(ctx, cache) {
    if (!ctx || !cache) return;

    // =========================================================================
    // MASTER UI CHECKBOX VARIABLE BINDINGS (CRASH-PROOF SYNCHRONIZATION)
    // =========================================================================
    // These variables MUST point exactly to your HTML element IDs to prevent script crashes!
    const showWings = document.getElementById('toggle-wings') ? document.getElementById('toggle-wings').checked : true;
    const showPods = document.getElementById('toggle-pods') ? document.getElementById('toggle-pods').checked : true;
    const showHull = document.getElementById('toggle-hull') ? document.getElementById('toggle-hull').checked : true;
    const showDecals = document.getElementById('toggle-decals') ? document.getElementById('toggle-decals').checked : true;
    const showThrusters = document.getElementById('toggle-thrusters') ? document.getElementById('toggle-thrusters').checked : true;
    
    // FIXED: Maps your id="toggle-canopy" checkbox state cleanly to the showCanopy variable!
    const showCanopy = document.getElementById('toggle-canopy') ? document.getElementById('toggle-canopy').checked : true;
            // =========================================================================
        // WING PATH MATH SUBROUTINE (FIXED FOR FULL RESOLUTION SPHERICAL FUEL PODS)
        // =========================================================================
        function drawComponentSide(isLeft, type, invert, isSilhouette) {
            ctx.save();
            if (isLeft) ctx.scale(-1, 1); 
            if (invert) ctx.scale(1, -1);  

            if (isSilhouette) {
                ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
            } else {
                ctx.fillStyle = cache.hullColor; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
            }

            const wM = cache.wingWidthMult;
            const pM = cache.podLengthMult;

            if (type === 1) {
                // Type 1: Slickback Razor Wing Geometry
                ctx.beginPath(); ctx.moveTo(10, -20 * pM);
                if (invert) {
                    ctx.bezierCurveTo(34 * wM, 10 * pM, 54 * wM, 26 * pM, 54 * wM, 34 * pM);
                    ctx.bezierCurveTo(54 * wM, 40 * pM, 42 * wM, 40 * pM, 24 * wM, 38 * pM);
                } else {
                    ctx.lineTo(54 * wM, 40 * pM); ctx.lineTo(24 * wM, 38 * pM);
                }
                ctx.lineTo(10, 42 * pM); ctx.lineTo(0, 44 * pM); ctx.fill(); ctx.stroke();
            } 
                        else if (type === 2) {
                // =========================================================================
                // FIXED TYPE 2: QUAD FLAPS (FRONT POD ON TOP LAYER OVERRIDE)
                // =========================================================================
                // Draws the rear pod first, then the front pod last so it stacks perfectly on top!
                ctx.beginPath();
                ctx.arc(16 * wM, 22 * pM, 17 * pM, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(22 * wM, -4 * pM, 21 * pM, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            } 
            else if (type === 3) {
                ctx.beginPath(); ctx.moveTo(10, -20 * pM); ctx.lineTo(38 * wM, 4 * pM); ctx.lineTo(38 * wM, -32 * pM); ctx.lineTo(44 * wM, 26 * pM); ctx.lineTo(32 * wM, 22 * pM); ctx.lineTo(0, 44 * pM);
                ctx.fill(); ctx.stroke();
            } 
            else if (type === 4) {
                // =========================================================================
                // FIXED TYPE 4: TRIPLE STACKED PODS (MIDDLE POD ON TOP LAYER OVERRIDE)
                // =========================================================================
                // Draws the top and bottom pods first, then layers the middle cluster pod last!
                ctx.beginPath();
                ctx.arc(20 * wM, -14 * pM, 13 * pM, 0, Math.PI * 2); 
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(20 * wM, 24 * pM, 13 * pM, 0, Math.PI * 2); 
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(22 * wM, 6 * pM, 16 * pM, 0, Math.PI * 2);  
                ctx.fill(); ctx.stroke();
            } else if (type === 5) {
                // Type 5: Snub Wing (Wider, Lower Flare Stance with Reversed Inversion Shift)
                const isWingInverted = cache.invertWings || false;
                // FIXED DIRECTION: Changed to a negative value to shift it down correctly on the inverted coordinate matrix
                let yShift = isWingInverted ? -16 * pM : 0;

                ctx.beginPath();
                ctx.moveTo(10, (-18 * pM) + yShift);
                ctx.lineTo(16 * wM, (-18 * pM) + yShift);
                // Widen out to 32 and pulled lower down to Y=0 to match the blue screenshot profile
                ctx.lineTo(32 * wM, (0 * pM) + yShift); 
                ctx.lineTo(24 * wM, (34 * pM) + yShift);
                ctx.bezierCurveTo(24 * wM, (42 * pM) + yShift, 14 * wM, (42 * pM) + yShift, 12 * wM, (40 * pM) + yShift);
                ctx.lineTo(0, (44 * pM) + yShift);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Embedded Black Triangular Inset Marking Panel (Tracks Shift Symmetrically)
                ctx.fillStyle = '#1e1b18';
                ctx.beginPath();
                ctx.moveTo(14 * wM, (-8 * pM) + yShift);
                ctx.lineTo(26 * wM, (1 * pM) + yShift); // Follows the wider, lower outer contour angle
                ctx.lineTo(14 * wM, (18 * pM) + yShift);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = '#1e1b18'; // Reset core color mapping bounds
            }


                        // =========================================================================
            // NEW TYPE 6: RECTANGULAR CARGO HOUSING (WITH SOLID BLACK ACCENT DISC DETAIL)
            // =========================================================================
            else if (type === 6) {
                ctx.beginPath();
                
                // Establish geometric structural coordinate bounds
                const innerX = 6;        
                const outerX = 42 * wM;
                const topY = -10 * pM;    
                const bottomY = 32 * pM;
                const cornerRadius = 3.5; 
                const biteSize = 15 * wM; 
                
                // 1. Draw the primary wing panel base plate
                ctx.moveTo(innerX, topY);
                ctx.lineTo(outerX - biteSize, topY);
                ctx.arcTo(outerX - biteSize, topY + biteSize, outerX, topY + biteSize, biteSize);
                ctx.lineTo(outerX, topY + biteSize);
                ctx.arcTo(outerX, bottomY, innerX, bottomY, cornerRadius);
                ctx.arcTo(innerX, bottomY, innerX, topY, cornerRadius);
                ctx.lineTo(innerX, bottomY);
                ctx.lineTo(0, 44 * pM);
                ctx.closePath();
                ctx.fill(); 
                ctx.stroke();

                // 2. FIXED: INJECT SOLID CHARCOAL MECHANICAL DETAILED LAYER DISC
                // Only renders this core tech accent detail if the ship is drawn in full color
                if (!isSilhouette) {
                    ctx.save();
                    ctx.fillStyle = '#1e1b18'; // Matches your charcoal interior base panels
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    
                    // Center the circular mechanical node perfectly in the middle of the block panel space
                    const circleX = (innerX + outerX) / 2 + 2;
                    const circleY = (topY + bottomY) / 2 + 4;
                    const circleRadius = 10 * wM; // Scaled proportionally to match your screenshot reference
                    
                    ctx.beginPath();
                    ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
                    ctx.fill(); 
                    ctx.stroke();
                    ctx.restore();
                }

        function exportFleetAsPNG() {
            const cards = document.querySelectorAll('.ship-card');
            if (cards.length === 0) return;

            const columns = parseInt(document.getElementById('input-columns').value) || 8;
            const spacing = parseInt(document.getElementById('input-spacing').value) || 6;
            const totalRows = Math.ceil(cards.length / columns);
            const displayLabels = document.getElementById('toggle-label').checked;

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = columns * 120 + (columns - 1) * spacing;
            exportCanvas.height = totalRows * 120 + (totalRows - 1) * spacing;
            const eCtx = exportCanvas.getContext('2d');

            // Force solid dark background fills
            eCtx.fillStyle = '#0b0c10'; 
            eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            cards.forEach((card, index) => {
                const srcCanvas = card.querySelector('canvas');
                const badge = card.querySelector('.trait-badge');
                if (!srcCanvas) return;

                const col = index % columns;
                const row = Math.floor(index / columns);
                const x = col * (120 + spacing);
                const y = row * (120 + spacing);

                eCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                eCtx.strokeStyle = '#222';
                eCtx.lineWidth = 1;
                eCtx.fillRect(x, y, 120, 120);

                eCtx.drawImage(srcCanvas, x, y);

                if (displayLabels && badge) {
                    eCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    eCtx.fillRect(x, y + 120 - 14, 120, 14);

                    eCtx.font = '900 8px monospace';

                    eCtx.textBaseline = 'middle';
                    eCtx.fillText(badge.innerText, x + 60, y + 120 - 7);
                }
            });

            // FIXED: Converts raw canvas frames into a pure binary layout 
            // to bypass Illustrator STEX texture registry crashes!
            exportCanvas.toBlob((blob) => {
                const downloadLink = document.createElement('a');
                downloadLink.download = 'procedural_fleet_sheet.png';
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.click();
                
                // Cleanup runtime object layout tracking memories safely
                setTimeout(() => URL.revokeObjectURL(downloadLink.href), 100);
            }, 'image/png');

// =========================================================================
// STEP 2: CANVAS-STYLE SVG VECTOR RECORDER
// Runs the exact same procedural ship drawing code,
// but records the Canvas paths as real SVG vector geometry.
// =========================================================================
function createSVGVectorContext() {

    let output = '';
    let currentPath = [];
    let currentX = 0;
    let currentY = 0;
    let hasCurrentPoint = false;

    let fillStyle = '#000000';
    let strokeStyle = '#000000';
    let lineWidth = 1;
    let lineJoin = 'miter';
    let lineCap = 'butt';
    let miterLimit = 10;

    let shadowBlur = 0;
    let shadowColor = 'transparent';

    const stateStack = [];
    let transformStack = [];

    function esc(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function styleString(fill, stroke) {

        let style = '';

        if (fill) {
            style += `fill:${esc(fill)};`;
        } else {
            style += 'fill:none;';
        }

        if (stroke) {
            style += `stroke:${esc(stroke)};`;
        } else {
            style += 'stroke:none;';
        }

        style += `stroke-width:${lineWidth};`;
        style += `stroke-linejoin:${lineJoin};`;
        style += `stroke-linecap:${lineCap};`;
        style += `stroke-miterlimit:${miterLimit};`;

        return style;
    }

    function shadowFilter() {

        if (!shadowBlur || shadowBlur <= 0) {
            return '';
        }

        if (!shadowColor || shadowColor === 'transparent') {
            return '';
        }

        const filterId = 'shipGlowFilter';

        if (!output.includes(`id="${filterId}"`)) {

            output =
                `<defs>` +
                `<filter id="${filterId}" ` +
                `x="-100%" y="-100%" width="300%" height="300%">` +
                `<feGaussianBlur stdDeviation="${shadowBlur / 2}" />` +
                `</filter>` +
                `</defs>` +
                output;
        }

        return `filter="url(#${filterId})"`;
    }

    function pathData() {
        return currentPath.join(' ');
    }

    function emitPath(fill, stroke) {

        if (!currentPath.length) {
            return;
        }

        output +=
            `<path d="${esc(pathData())}" ` +
            `style="${styleString(fill, stroke)}" ` +
            `${shadowFilter()}/>\n`;
    }

    function distance(x1, y1, x2, y2) {

        const dx = x2 - x1;
        const dy = y2 - y1;

        return Math.sqrt(dx * dx + dy * dy);
    }

    return {

        // -------------------------------------------------------------
        // Canvas state
        // -------------------------------------------------------------

        save() {

            stateStack.push({
                fillStyle,
                strokeStyle,
                lineWidth,
                lineJoin,
                lineCap,
                miterLimit,
                shadowBlur,
                shadowColor,
                transformStack: transformStack.slice()
            });

            output += '<g>\n';
        },

        restore() {

            if (stateStack.length) {

                const state =
                    stateStack.pop();

                fillStyle = state.fillStyle;
                strokeStyle = state.strokeStyle;
                lineWidth = state.lineWidth;
                lineJoin = state.lineJoin;
                lineCap = state.lineCap;
                miterLimit = state.miterLimit;
                shadowBlur = state.shadowBlur;
                shadowColor = state.shadowColor;
                transformStack = state.transformStack;
            }

            output += '</g>\n';
        },

        translate(x, y) {

            output +=
                `<g transform="translate(${x} ${y})">\n`;

            transformStack.push('translate');
        },

        rotate(angle) {

            const degrees =
                angle * 180 / Math.PI;

            output +=
                `<g transform="rotate(${degrees})">\n`;

            transformStack.push('rotate');
        },

        scale(x, y) {

            output +=
                `<g transform="scale(${x} ${y})">\n`;

            transformStack.push('scale');
        },

        // -------------------------------------------------------------
        // Canvas style properties
        // -------------------------------------------------------------

        set fillStyle(value) {
            fillStyle = value;
        },

        get fillStyle() {
            return fillStyle;
        },

        set strokeStyle(value) {
            strokeStyle = value;
        },

        get strokeStyle() {
            return strokeStyle;
        },

        set lineWidth(value) {
            lineWidth = value;
        },

        get lineWidth() {
            return lineWidth;
        },

        set lineJoin(value) {
            lineJoin = value;
        },

        get lineJoin() {
            return lineJoin;
        },

        set lineCap(value) {
            lineCap = value;
        },

        get lineCap() {
            return lineCap;
        },

        set miterLimit(value) {
            miterLimit = value;
        },

        get miterLimit() {
            return miterLimit;
        },

        set shadowBlur(value) {
            shadowBlur = value;
        },

        get shadowBlur() {
            return shadowBlur;
        },

        set shadowColor(value) {
            shadowColor = value;
        },

        get shadowColor() {
            return shadowColor;
        },

        // -------------------------------------------------------------
        // Path commands
        // -------------------------------------------------------------

        beginPath() {

            currentPath = [];
            hasCurrentPoint = false;
        },

        closePath() {

            currentPath.push('Z');
        },

        moveTo(x, y) {

            currentPath.push(
                `M ${x} ${y}`
            );

            currentX = x;
            currentY = y;
            hasCurrentPoint = true;
        },

        lineTo(x, y) {

            if (!hasCurrentPoint) {

                currentPath.push(
                    `M ${x} ${y}`
                );

            } else {

                currentPath.push(
                    `L ${x} ${y}`
                );
            }

            currentX = x;
            currentY = y;
            hasCurrentPoint = true;
        },

        bezierCurveTo(
            cp1x, cp1y,
            cp2x, cp2y,
            x, y
        ) {

            if (!hasCurrentPoint) {

                currentPath.push(
                    `M ${x} ${y}`
                );

            } else {

                currentPath.push(
                    `C ${cp1x} ${cp1y} ` +
                    `${cp2x} ${cp2y} ` +
                    `${x} ${y}`
                );
            }

            currentX = x;
            currentY = y;
            hasCurrentPoint = true;
        },

        quadraticCurveTo(
            cpx, cpy,
            x, y
        ) {

            if (!hasCurrentPoint) {

                currentPath.push(
                    `M ${x} ${y}`
                );

            } else {

                currentPath.push(
                    `Q ${cpx} ${cpy} ${x} ${y}`
                );
            }

            currentX = x;
            currentY = y;
            hasCurrentPoint = true;
        },

        // -------------------------------------------------------------
        // ARC
        // -------------------------------------------------------------

        arc(
            cx,
            cy,
            radius,
            startAngle,
            endAngle,
            anticlockwise
        ) {

            let start = startAngle;
            let end = endAngle;

            const TWO_PI =
                Math.PI * 2;

            if (!anticlockwise) {

                while (end < start) {
                    end += TWO_PI;
                }

                if (end - start > TWO_PI) {
                    end = start + TWO_PI;
                }

            } else {

                while (end > start) {
                    end -= TWO_PI;
                }

                if (start - end > TWO_PI) {
                    end = start - TWO_PI;
                }
            }

            const totalAngle =
                end - start;

            const startX =
                cx + radius * Math.cos(start);

            const startY =
                cy + radius * Math.sin(start);

            const endX =
                cx + radius * Math.cos(end);

            const endY =
                cy + radius * Math.sin(end);

            // Full circle
            if (
                Math.abs(totalAngle) >=
                TWO_PI - 0.0001
            ) {

                const midX =
                    cx +
                    radius *
                    Math.cos(
                        start +
                        totalAngle / 2
                    );

                const midY =
                    cy +
                    radius *
                    Math.sin(
                        start +
                        totalAngle / 2
                    );

                if (
                    hasCurrentPoint &&
                    distance(
                        currentX,
                        currentY,
                        startX,
                        startY
                    ) > 0.0001
                ) {

                    currentPath.push(
                        `L ${startX} ${startY}`
                    );
                }

                if (!hasCurrentPoint) {

                    currentPath.push(
                        `M ${startX} ${startY}`
                    );
                }

                currentPath.push(
                    `A ${radius} ${radius} 0 1 ` +
                    `${anticlockwise ? 0 : 1} ` +
                    `${midX} ${midY} ` +
                    `A ${radius} ${radius} 0 1 ` +
                    `${anticlockwise ? 0 : 1} ` +
                    `${startX} ${startY}`
                );

            } else {

                const largeArc =
                    Math.abs(totalAngle) >
                    Math.PI ? 1 : 0;

                const sweep =
                    anticlockwise ? 0 : 1;

                if (!hasCurrentPoint) {

                    currentPath.push(
                        `M ${startX} ${startY}`
                    );

                } else if (
                    distance(
                        currentX,
                        currentY,
                        startX,
                        startY
                    ) > 0.0001
                ) {

                    currentPath.push(
                        `L ${startX} ${startY}`
                    );
                }

                currentPath.push(
                    `A ${radius} ${radius} 0 ` +
                    `${largeArc} ${sweep} ` +
                    `${endX} ${endY}`
                );
            }

            currentX = endX;
            currentY = endY;
            hasCurrentPoint = true;
        },

        // -------------------------------------------------------------
        // ARC TO
        //
        // Canvas:
        // arcTo(x1, y1, x2, y2, radius)
        //
        // Creates a tangent line from the current point
        // toward x1/y1, followed by a circular arc toward x2/y2.
        // -------------------------------------------------------------

        arcTo(
            x1,
            y1,
            x2,
            y2,
            radius
        ) {

            // Canvas behavior:
            // If there is no current point, arcTo behaves
            // like moveTo(x1, y1).

            if (!hasCurrentPoint) {

                currentPath.push(
                    `M ${x1} ${y1}`
                );

                currentX = x1;
                currentY = y1;
                hasCurrentPoint = true;

                return;
            }

            // Zero radius is effectively a line.
            if (
                radius === 0
            ) {

                currentPath.push(
                    `L ${x1} ${y1}`
                );

                currentX = x1;
                currentY = y1;

                return;
            }

            const p0x = currentX;
            const p0y = currentY;

            const p1x = x1;
            const p1y = y1;

            const p2x = x2;
            const p2y = y2;

            const v1x =
                p0x - p1x;

            const v1y =
                p0y - p1y;

            const v2x =
                p2x - p1x;

            const v2y =
                p2y - p1y;

            const len1 =
                Math.sqrt(
                    v1x * v1x +
                    v1y * v1y
                );

            const len2 =
                Math.sqrt(
                    v2x * v2x +
                    v2y * v2y
                );

            // Degenerate geometry:
            // current point == corner or corner == destination.
            if (
                len1 < 0.000001 ||
                len2 < 0.000001
            ) {

                currentPath.push(
                    `L ${p1x} ${p1y}`
                );

                currentX = p1x;
                currentY = p1y;

                return;
            }

            // Normalize both vectors.
            const u1x =
                v1x / len1;

            const u1y =
                v1y / len1;

            const u2x =
                v2x / len2;

            const u2y =
                v2y / len2;

            // Angle between the two vectors.
            let dot =
                u1x * u2x +
                u1y * u2y;

            dot =
                Math.max(
                    -1,
                    Math.min(1, dot)
                );

            const angle =
                Math.acos(dot);

            // Straight line or 180-degree turn.
            if (
                angle < 0.000001 ||
                Math.abs(
                    Math.PI - angle
                ) < 0.000001
            ) {

                currentPath.push(
                    `L ${p1x} ${p1y}`
                );

                currentX = p1x;
                currentY = p1y;

                return;
            }

            // Tangent distance from the corner.
            const tangentDistance =
                radius /
                Math.tan(angle / 2);

            // Prevent the radius from creating
            // a tangent point beyond either segment.
            const maxTangent =
                Math.min(
                    len1,
                    len2
                );

            const actualTangent =
                Math.min(
                    tangentDistance,
                    maxTangent
                );

            // Actual radius after limiting the tangent.
            const actualRadius =
                actualTangent *
                Math.tan(angle / 2);

            // First tangent point.
            const tangent1x =
                p1x +
                u1x *
                actualTangent;

            const tangent1y =
                p1y +
                u1y *
                actualTangent;

            // Second tangent point.
            const tangent2x =
                p1x +
                u2x *
                actualTangent;

            const tangent2y =
                p1y +
                u2y *
                actualTangent;

            // Draw the straight section to the
            // first tangent point.
            currentPath.push(
                `L ${tangent1x} ${tangent1y}`
            );

            // Determine SVG sweep direction.
            const cross =
                u1x * u2y -
                u1y * u2x;

            const sweep =
                cross < 0 ? 1 : 0;

            // arcTo is always a circular corner.
            currentPath.push(
                `A ${actualRadius} ${actualRadius} 0 ` +
                `0 ${sweep} ` +
                `${tangent2x} ${tangent2y}`
            );

            currentX = tangent2x;
            currentY = tangent2y;
            hasCurrentPoint = true;
        },

        // -------------------------------------------------------------
        // Rectangle commands
        // -------------------------------------------------------------

        fillRect(
            x,
            y,
            width,
            height
        ) {

            output +=
                `<rect x="${x}" y="${y}" ` +
                `width="${width}" ` +
                `height="${height}" ` +
                `style="${styleString(
                    fillStyle,
                    null
                )}" ` +
                `${shadowFilter()}/>\n`;
        },

        strokeRect(
            x,
            y,
            width,
            height
        ) {

            output +=
                `<rect x="${x}" y="${y}" ` +
                `width="${width}" ` +
                `height="${height}" ` +
                `style="${styleString(
                    null,
                    strokeStyle
                )}" ` +
                `${shadowFilter()}/>\n`;
        },

        // -------------------------------------------------------------
        // Paint current path
        // -------------------------------------------------------------

        fill() {

            emitPath(
                fillStyle,
                null
            );
        },

        stroke() {

            emitPath(
                null,
                strokeStyle
            );
        },

        // -------------------------------------------------------------
        // Final SVG contents
        // -------------------------------------------------------------

        getSVG() {

            return output;
        }
    };
}

    if (!cards.length) {
        return;
    }

    const columns =
        parseInt(
            document.getElementById('input-columns').value
        ) || 8;

    const spacing =
        parseInt(
            document.getElementById('input-spacing').value
        ) || 6;

    const displayLabels =
        document.getElementById('toggle-label').checked;

    const cellSize = 120;

    const rows =
        Math.ceil(
            cards.length / columns
        );

    const width =
        columns * cellSize +
        (columns - 1) * spacing;

    const height =
        rows * cellSize +
        (rows - 1) * spacing;


    // -------------------------------------------------------------
    // SVG HEADER
    // -------------------------------------------------------------

    let svg =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        '<svg ' +
        'xmlns="http://www.w3.org/2000/svg" ' +
        'xmlns:xlink="http://www.w3.org/1999/xlink" ' +
        'version="1.1" ' +
        'width="' + width + '" ' +
        'height="' + height + '" ' +
        'viewBox="0 0 ' + width + ' ' + height + '">\n';


    // -------------------------------------------------------------
    // DEFINITIONS
    // -------------------------------------------------------------

    svg +=
        '<defs>\n' +
        '</defs>\n';


    // -------------------------------------------------------------
    // FLEET BACKGROUND
    // -------------------------------------------------------------

    svg +=
        '<rect ' +
        'x="0" ' +
        'y="0" ' +
        'width="' + width + '" ' +
        'height="' + height + '" ' +
        'fill="#0b0c10"/>\n';


    // -------------------------------------------------------------
    // SHIPS
    // -------------------------------------------------------------

    cards.forEach(function(card, index) {

        const cache =
            card._shipCache;

        if (!cache) {
            return;
        }


        const col =
            index % columns;

        const row =
            Math.floor(
                index / columns
            );


        const x =
            col *
            (cellSize + spacing);

        const y =
            row *
            (cellSize + spacing);


        // ---------------------------------------------------------
        // CELL BACKGROUND
        // ---------------------------------------------------------

        svg +=
            '<rect ' +
            'x="' + x + '" ' +
            'y="' + y + '" ' +
            'width="' + cellSize + '" ' +
            'height="' + cellSize + '" ' +
            'fill="#000000" ' +
            'fill-opacity="0.4" ' +
            'stroke="#222222" ' +
            'stroke-width="1"/>\n';


        // ---------------------------------------------------------
        // CREATE FRESH VECTOR CONTEXT
        // ---------------------------------------------------------

        const svgCtx =
            createSVGVectorContext();


        // ---------------------------------------------------------
        // RUN EXISTING PROCEDURAL SHIP RENDERER
        // ---------------------------------------------------------

        drawProceduralShip(
            svgCtx,
            cache
        );


        let shipSVG =
            svgCtx.getSVG();


        // ---------------------------------------------------------
        // PLACE SHIP INTO ITS CELL
        // ---------------------------------------------------------

        svg +=
            '<g transform="translate(' +
            x + ' ' +
            y +
            ')">\n';

        svg += shipSVG;

        svg +=
            '</g>\n';


        // ---------------------------------------------------------
        // TRAIT LABEL
        // ---------------------------------------------------------

        if (displayLabels) {

            const badge =
                card.querySelector(
                    '.trait-badge'
                );

            if (badge) {

                const computedStyle =
                    window.getComputedStyle(
                        badge
                    );

                let color =
                    computedStyle.color ||
                    '#ffffff';


                // Convert rgb(...) to a valid SVG color.
                // Illustrator handles rgb() reliably.
                if (
                    color &&
                    color.indexOf('rgb') === 0
                ) {
                    color =
                        color
                            .replace(
                                /^rgba?\(/,
                                'rgb('
                            )
                            .replace(
                                /\)$/,
                                ')'
                            );
                }


                const text =
                    badge.innerText
                        .replace(
                            /&/g,
                            '&amp;'
                        )
                        .replace(
                            /</g,
                            '&lt;'
                        )
                        .replace(
                            />/g,
                            '&gt;'
                        )
                        .replace(
                            /"/g,
                            '&quot;'
                        );


                svg +=
                    '<rect ' +
                    'x="' + x + '" ' +
                    'y="' + (y + 106) + '" ' +
                    'width="' + cellSize + '" ' +
                    'height="14" ' +
                    'fill="#000000" ' +
                    'fill-opacity="0.65"/>\n';


                svg +=
                    '<text ' +
                    'x="' + (x + 60) + '" ' +
                    'y="' + (y + 115) + '" ' +
                    'fill="' + color + '" ' +
                    'font-family="monospace" ' +
                    'font-size="8" ' +
                    'font-weight="900" ' +
                    'text-anchor="middle">' +
                    text +
                    '</text>\n';
            }
        }

    });


    // -------------------------------------------------------------
    // CLOSE SVG
    // -------------------------------------------------------------

    svg +=
        '</svg>';


    // -------------------------------------------------------------
    // DOWNLOAD
    // -------------------------------------------------------------

    const blob =
        new Blob(
            [svg],
            {
                type:
                    'image/svg+xml;charset=utf-8'
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement('a');

    link.href = url;

    link.download =
        'procedural_fleet_sheet.svg';


    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );


    setTimeout(
        function() {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );
}

        window.onload = generateFleetSheet;
    </script>
</body>
</html>
